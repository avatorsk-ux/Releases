name: publish-plan
on:
  push:
    tags:
      - "plan-*"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#plan-}"
          notes="Обновление календаря."
          if [[ -f release-notes.txt ]]; then
            notes=$(cat release-notes.txt)
          fi
          gh release create "$tag" "plan-${version}.zip" \
            --title "План мероприятий ${version}" \
            --notes "$notes" \
            --repo "${GITHUB_REPOSITORY}"
