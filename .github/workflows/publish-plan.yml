name: publish-plan
on:
  push:
    tags:
      - "plan-*"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#plan-}"
          gh release create "$tag" "plan-${version}.zip" \
            --title "План мероприятий ${version}" \
            --notes "Перед удалением мероприятия или контрольной программа спрашивает подтверждение. Если удалить не получилось, запись остаётся на экране." \
            --repo "${GITHUB_REPOSITORY}"
